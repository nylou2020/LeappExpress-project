---
- name: Summarize Leapp Report Risk Factors
  ansible.builtin.script:
    cmd: Rpt_Stats.sh
  become: true

- name: Read last line of remote file
  ansible.builtin.command: tail -1 /var/log/leapp/RF_Summary.txt
  register: lastline_output

- name: Display last line of remote file
  ansible.builtin.debug:
    var: lastline_output.stdout

- name: Parse the lastline to get Host Tier level
  ansible.builtin.shell: "echo '{{ lastline_output.stdout }}' | awk '{print $4}'"
  register: tier_level 

- name: Display the risk factor tier level
  ansible.builtin.debug:
    var: tier_level.stdout

- name: Display host tier msg that triggers OS upgrade
  ansible.builtin.debug:
    msg: "The host, {{ ansible_hostname }}, has {{ tier_level.stdout }} status. A candidate for an OS upgrade."
  when: tier_level.stdout != "Tier3"

- name: Display host tier msg that does NOT trigger an OS upgrade
  ansible.builtin.debug:
    msg: "The host, {{ ansible_hostname }}, has {{ tier_level.stdout }} status. NOT a candidate for OS upgrade. Resolve Inhibitor risk factors."
  when: tier_level.stdout == "Tier3"
